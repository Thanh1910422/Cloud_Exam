
{% extends "base.html" %}

{% block content %}

<section class="container">

    <h1>Chỉnh sửa đề thi</h1>

    <div class="feature-card">

        <form method="POST">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <p>
                <label>Tên đề thi *</label><br>
                <input type="text"
                       name="title"
                       value="{{ exam.title }}"
                       maxlength="200"
                       required
                       style="width:100%; padding:10px;">
            </p>

            <p>
                <label>Mô tả đề thi</label><br>
                <textarea name="description"
                          rows="4"
                          style="width:100%; padding:10px;">{{ exam.description or '' }}</textarea>
            </p>

            <p>
                <label>Cấp độ HSK *</label><br>
                <select name="level_id" required
                        style="width:100%; padding:10px;">

                    {% for level in levels %}
                    <option value="{{ level.id }}"
                        {% if level.id == exam.level_id %}selected{% endif %}>
                        {{ level.level_name }}
                    </option>
                    {% endfor %}

                </select>
            </p>

            <p>
                <label>Giảng viên phụ trách</label><br>
                <select name="teacher_id"
                        style="width:100%; padding:10px;">

                    <option value="">-- Chưa phân công --</option>

                    {% for teacher in teachers %}
                    <option value="{{ teacher.id }}"
                        {% if teacher.id == exam.teacher_id %}selected{% endif %}>
                        {{ teacher.full_name }} - {{ teacher.email }}
                    </option>
                    {% endfor %}

                </select>
            </p>

            <p>
                <label>Thời gian làm bài (phút) *</label><br>
                <input type="number"
                       name="duration_minutes"
                       value="{{ exam.duration_minutes }}"
                       min="1"
                       required
                       style="width:100%; padding:10px;">
            </p>

            <p>
                <label>Trạng thái</label><br>
                <select name="status"
                        style="width:100%; padding:10px;">

                    <option value="draft"
                        {% if exam.status == 'draft' %}selected{% endif %}>
                        Bản nháp
                    </option>

                    <option value="published"
                        {% if exam.status == 'published' %}selected{% endif %}>
                        Đã xuất bản
                    </option>

                    <option value="archived"
                        {% if exam.status == 'archived' %}selected{% endif %}>
                        Đã lưu trữ
                    </option>

                </select>
            </p>

            <button type="submit" class="btn">
                Lưu thay đổi
            </button>

            <a href="{{ url_for('exam.exams') }}">
                Hủy
            </a>

        </form>

    </div>

</section>

{% endblock %}
