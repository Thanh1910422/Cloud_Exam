
{% extends "base.html" %}

{% block title %}Tạo tài khoản Giảng viên - HSK Exam{% endblock %}

{% block content %}
<section class="levels-section">
    <div class="section-heading">
        <span class="section-tag">TEACHER MANAGEMENT</span>
        <h2>Tạo tài khoản Giảng viên</h2>
        <p>Chỉ quản trị viên mới có quyền tạo tài khoản Giảng viên.</p>
    </div>

    <div class="feature-card" style="max-width: 600px; margin: 30px auto; padding: 30px;">

        <form method="POST"
              action="{{ url_for('admin.create_teacher') }}">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <div style="margin-bottom: 20px;">
                <label for="full_name">Họ và tên</label>
                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Nhập họ và tên giảng viên"
                    maxlength="150"
                    required
                    style="width: 100%; padding: 12px; margin-top: 8px;"
                >
            </div>

            <div style="margin-bottom: 20px;">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Nhập địa chỉ email"
                    required
                    style="width: 100%; padding: 12px; margin-top: 8px;"
                >
            </div>

            <div style="margin-bottom: 20px;">
                <label for="password">Mật khẩu</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Mật khẩu tối thiểu 8 ký tự"
                    minlength="8"
                    required
                    style="width: 100%; padding: 12px; margin-top: 8px;"
                >
            </div>

            <button type="submit" class="btn">
                Tạo tài khoản Giảng viên
            </button>

            <a href="{{ url_for('admin.dashboard') }}"
               style="display: inline-block; margin-left: 12px;">
                Quay lại Dashboard
            </a>

        </form>
    </div>
</section>
{% endblock %}
