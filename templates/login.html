{% extends "base.html" %}

{% block title %}Đăng nhập - HSK Exam{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-heading">
            <span class="auth-symbol">汉</span>
            <h1>Chào mừng trở lại!</h1>
            <p>Đăng nhập để tiếp tục luyện thi HSK.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Nhập email"
                value="{{ request.form.get('email', '') }}"
                required
            >

            <label for="password">Mật khẩu</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Nhập mật khẩu"
                required
            >

            <button type="submit" class="btn-primary auth-submit">
                Đăng nhập
            </button>
        </form>

        <p class="auth-switch">
            Chưa có tài khoản?
            <a href="{{ url_for('auth.register') }}">Đăng ký ngay</a>
        </p>
    </div>
</section>
{% endblock %}
